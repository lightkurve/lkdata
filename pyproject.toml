[project]
name = "lkdata"
version = "0.1.0"
description = "A friendly package for analysing TESS & Kepler time series data"
authors = [
    {name = "TESS Science Support Center", email= "tesshelp@bigbang.gsfc.nasa.gov"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.26.3",
    "pandas[plot, output-formatting]>=2.1.4",  # for styling the dataframe
]

[project.optional-dependencies]
dev = [
    "astropy", # <6.1.3 for python<3.10
    "bump2version >= 1.0.1",
    "coverage[toml] >=7.4.0",
    "ipykernel >= 6.29.5",
    "IPython >= 8.18.1",
    "jupyter >= 1.0.0",
    "line-profiler >= 4.1.2",
    "mypy >= 1.8.0",
    "nbsphinx >= 0.9.3",
    "pre-commit >= 3.6.0",
    "pydata-sphinx-theme >= 0.15.1",
    "pytest >= 7.4.4",
    "ruff >= 0.1.13",
    "sphinx >= 7.2.6",
    "sphinx-astropy >= 1.9.1",
    "sphinx-autobuild >= 2021.3.14",
    "sphinx-autodoc-typehints >= 1.25.2",
    "sphinx-copybutton >= 0.5.2",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.coverage.run]
relative_files = true
omit = [
    "tests/*"
]
