[project]
name = "lkdata"
version = "1.0.1"
description = "A friendly package for analysing TESS & Kepler time series data"
authors = [
    { name = "TESS Science Support Center", email = "tesshelp@bigbang.gsfc.nasa.gov" }]
license = "MIT"
readme = "README.rst"
requires-python = ">=3.11,<4.0"
dependencies = [
    "numpy>=2.2.0",
    "pandas[plot, output-formatting]>=2.3", # for styling the dataframe
]

[project.optional-dependencies]
dev = [
    "astropy>=6.1",
    "bump2version>=1.0.1",
    "coverage[toml]>=7.4.0",
    "ipykernel>=6.29.5",
    "IPython>=8.18.1",
    "jupyter>=1.0.1",
    "line-profiler>=4.1.2",
    "mypy>=1.8.0",
    "nbsphinx>=0.9.3",
    "pre-commit>=3.6.0",
    "pydata-sphinx-theme>=0.15.1",
    "pytest>=8.3.0",
    "ruff>=0.15",
    "sphinx>=7.2.6",
    "sphinx-astropy>=1.9.1",
    "sphinx-autobuild>=2021.3.14",
    "sphinx-autodoc-typehints>=1.25.2",
    "sphinx-copybutton>=0.5.2",
]

[tool.poetry.group.dev]
optional = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "astropy>=6.1",
    "bump2version>=1.0.1",
    "coverage[toml]>=7.4.0",
    "ipykernel>=6.29.5",
    "IPython>=8.18.1",
    "jupyter>=1.0.1",
    "line-profiler>=4.1.2",
    "mypy>=1.8.0",
    "nbsphinx>=0.9.3",
    "pre-commit>=3.6.0",
    "pydata-sphinx-theme>=0.15.1",
    "pytest>=8.3.0",
    "ruff>=0.15",
    "sphinx-astropy>=1.9.1",
    "sphinx-autobuild>=2021.3.14",
    "sphinx-autodoc-typehints>=1.25.2",
    "sphinx-copybutton>=0.5.2",
    "sphinx>=7.2.6",
]


[tool.coverage.run]
relative_files = true
omit = [
    "tests/*"
]
