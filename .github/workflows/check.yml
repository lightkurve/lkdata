name: Check format

on:
  pull_request:
  push:
    branches:
      - "main"

jobs:
  check:
    runs-on: ubuntu-latest
    needs: install-deps

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.9

    - name: Test with pytest
      run: |
        make check
